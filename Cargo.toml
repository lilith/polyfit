[package]
name = "polyfit"
authors = ["@rscarson"]
description = "Because you don't need to be able to build a powerdrill to use one safely"
edition = "2021"
license = "MIT"
version = "0.11.0"
repository = "https://github.com/rscarson/polyfit"
homepage = "https://polyfit.richardcarson.ca"

keywords = ["polynomial", "fitting", "regression", "numerical", "approximation"]
categories = ["algorithms", "data-structures", "mathematics", "science", "visualization"]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["transforms", "plotting"]
transforms = ["rand", "rand_distr"]
plotting = ["plotters"]
parallel = ["rayon"]

[dependencies]
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
nalgebra = "0.33.2"
num-traits = "0.2.19"
thiserror = "2.0.20"

# Plotting
plotters = {version = "0.3.7", optional = true, default-features = false, features = [
    "svg_backend", "bitmap_backend", "bitmap_encoder", "ab_glyph",
    "all_series", "all_elements", "full_palette", "colormaps"
]}

# Transforms
rand = {version = "0.9.2", optional = true}
rand_distr = {version = "0.5.1", optional = true}

# Parallel processing
rayon = {version = "1.12.0", optional = true}

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "fitting"
harness = false

[[bench]]
name = "root_finding"
harness = false

[[bin]]
name = "basis_select"
path = "src/bin/basis_select.rs"

[[example]]
name = "whats_an_orthogonal"
required-features = ["transforms", "plotting"]

[[example]]
name = "validating_your_choice_of_basis"
required-features = ["transforms", "plotting"]

[[example]]
name = "transforms"
required-features = ["transforms", "plotting"]

[[example]]
name = "simple_fit"
required-features = ["transforms"]

[[example]]
name = "scaling_transforms"
required-features = ["transforms", "plotting"]

[[example]]
name = "outlier_detection"
required-features = ["plotting"]

[[example]]
name = "calculus"
required-features = ["plotting"]

[[example]]
name = "adding_noise"
required-features = ["transforms", "plotting"]

[[example]]
name = "fits_for_generating_graphs"
required-features = ["transforms", "plotting"]

[[example]]
name = "transforms_demo"
required-features = ["transforms", "plotting"]